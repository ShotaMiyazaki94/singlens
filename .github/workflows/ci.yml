name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            jax: "jax==0.11.2"
          - python-version: "3.12"
            jax: "jax"
          - python-version: "3.13"
            jax: "jax"
          - python-version: "3.14"
            jax: "jax"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade '.[test]' ruff '${{ matrix.jax }}'
      - run: ruff check src tests example tools docs/conf.py
      - run: ruff format --check src tests example tools docs/conf.py
      - run: python -m pytest
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install 'singlens[test]' --no-index --find-links dist --no-deps
      - run: python -m pip install 'jax>=0.11.2' 'numpy>=2.0' 'pytest>=8' 'scipy>=1.14'
      - run: python -m pytest
      - run: python -c "import singlens; print(singlens.magnification(0., 0., 0.1, 20.))"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  documentation:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[docs,test]'
      - run: python -m pytest tests/test_inference.py
      - run: python -m sphinx -b html -W --keep-going -D nb_execution_mode=force docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
