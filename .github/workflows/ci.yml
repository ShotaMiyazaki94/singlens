name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev,examples,validation]' 'jax==0.11.2'
      - run: ruff check src tests example tools docs/conf.py
      - run: ruff format --check src tests example tools docs/conf.py
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import jax
          import numpy as np
          import singlens
          jax.config.update("jax_enable_x64", True)
          geometry = singlens.AnnualParallax(t_ref=8000., ra_deg=266.4, dec_deg=-29.)
          value = singlens.magnification(
              8000., 8000., 0.01, 20., rho=0.01, a1=0.5,
              parallax=geometry, pi_e_n=0.1, pi_e_e=0.1,
          )
          assert np.isfinite(value) and value > 1
          PY
